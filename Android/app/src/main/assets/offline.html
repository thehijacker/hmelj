<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No connection</title>
<!--
  Shown by MainActivity#showOfflinePage() when the WebView can't load the app at
  all (no network, wrong Wi-Fi, VPN down, server off). Bundled as an asset rather
  than served, because at that moment nothing can be fetched — and unlike the PWA,
  this app usually points at a plain-http LAN address, which is not a secure
  context, so there's no service worker and no cached shell to fall back on.

  Kept deliberately dependency-free: no fonts, no images, no scripts beyond the
  two buttons below.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-right));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #202124;
  }
  .card { max-width: 380px; text-align: center; }
  .icon { font-size: 46px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.5; margin: 0 0 8px; color: #5f6368; }
  .server { font-size: 12.5px; color: #80868b; word-break: break-all; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid #dadce0; background: #fff; color: #202124;
  }
  button.primary { background: #0b57d0; border-color: #0b57d0; color: #fff; }
  button:disabled { opacity: .6; }
  @media (prefers-color-scheme: dark) {
    body { background: #17181a; color: #e8eaed; }
    p { color: #9aa0a6; }
    .server { color: #80868b; }
    button { background: #202124; border-color: #3c4043; color: #e8eaed; }
    button.primary { background: #8ab4f8; border-color: #8ab4f8; color: #17181a; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1 id="title">No connection to the Hmelj server</h1>
    <p id="body">Hmelj keeps your mail on the server, so it can't show anything until that connection is back. Check your Wi-Fi, mobile data, or VPN — then try again.</p>
    <div class="server" id="server"></div>
    <div class="row">
      <button class="primary" id="retry">Try again</button>
      <button id="change">Change server</button>
    </div>
  </div>
<script>
  var bridge = window.AndroidApp || window.AndroidCodexa || {};

  try {
    var url = bridge.getServerUrl ? bridge.getServerUrl() : '';
    if (url) document.getElementById('server').textContent = url;
  } catch (e) { /* older shell without the getter — the page still works */ }

  document.getElementById('retry').addEventListener('click', function () {
    this.disabled = true;
    var btn = this;
    setTimeout(function () { btn.disabled = false; }, 2000);
    // The shell owns the server address and the reload; a file:// page can't
    // navigate there by itself.
    if (bridge.retryConnection) bridge.retryConnection();
  });

  document.getElementById('change').addEventListener('click', function () {
    if (bridge.changeServer) bridge.changeServer();
  });

  // Retry by itself when the device gets a network back, so a phone that
  // reconnects in a pocket is already on the mail list when it's next looked at.
  // (The shell also drives this from its own ConnectivityManager callback — this
  // is just the in-page half, for WebViews that do fire the event.)
  window.addEventListener('online', function () {
    if (bridge.retryConnection) bridge.retryConnection();
  });
</script>
</body>
</html>
